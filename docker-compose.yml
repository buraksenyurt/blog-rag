name: blog-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: blog-rag-qdrant
    ports:
      - "6333:6333"   # REST + Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
